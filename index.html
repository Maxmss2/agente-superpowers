<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agente Superpowers IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: linear-gradient(135deg, #111936, #18265a);
      border-bottom: 1px solid #29376e;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #b9c4ee;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: #111936;
      border: 1px solid #29376e;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .status {
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #0b1020;
      color: #9ee7b0;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #dce2ff;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #354477;
      background: #080d1b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6d8cff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #526dff, #7657ff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .resultado {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: #080d1b;
      border: 1px solid #29376e;
      white-space: pre-wrap;
      line-height: 1.6;
      display: none;
    }

    .erro {
      color: #ff9d9d;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #7f8bb8;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Agente Superpowers IA</h1>
  <p>Seu assistente inteligente conectado ao Gemini</p>
</header>

<main>

  <div class="card">

    <div class="status" id="status">
      🟡 Verificando conexão com o agente...
    </div>

    <label for="prompt">
      🤖 O que você quer que o Agente Superpowers faça?
    </label>

    <textarea
      id="prompt"
      placeholder="Digite seu comando aqui..."
    >Olá, Agente Superpowers! Diga quem você é e confirme que está conectado ao Gemini.</textarea>

    <button id="btn" onclick="enviarComando()">
      🚀 Enviar comando
    </button>

    <div id="resultado" class="resultado"></div>

  </div>

</main>

<footer>
  Agente Superpowers IA • Powered by Gemini
</footer>

<script>

  // URL OFICIAL DO BACKEND NO RAILWAY
  const BACKEND_URL =
    "https://agente-superpowers-production.up.railway.app";

  // Verifica se o backend está online
  async function verificarServidor() {

    const status = document.getElementById("status");

    try {

      const resposta = await fetch(BACKEND_URL + "/", {
        method: "GET"
      });

      const dados = await resposta.json();

      if (dados.status === "online") {

        if (dados.gemini) {
          status.innerHTML =
            "🟢 Agente online • Gemini conectado";
        } else {
          status.innerHTML =
            "🟡 Agente online • GEMINI_API_KEY não encontrada";
        }

      } else {

        status.innerHTML =
          "🔴 O servidor respondeu de forma inesperada";
      }

    } catch (erro) {

      status.innerHTML =
        "🔴 Não foi possível conectar ao backend";
    }
  }

  // Envia comando para o Gemini
  async function enviarComando() {

    const prompt =
      document.getElementById("prompt").value.trim();

    const resultado =
      document.getElementById("resultado");

    const botao =
      document.getElementById("btn");

    if (!prompt) {

      resultado.style.display = "block";
      resultado.innerHTML =
        "⚠️ Digite um comando primeiro.";

      return;
    }

    botao.disabled = true;
    botao.innerText = "⏳ Processando...";

    resultado.style.display = "block";
    resultado.className = "resultado";
    resultado.innerText =
      "🤖 Agente Superpowers está pensando...";

    try {

      const resposta = await fetch(
        BACKEND_URL + "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt
          })
        }
      );

      // Primeiro recebemos como texto.
      // Isso evita que um HTML inesperado quebre o JSON.
      const texto = await resposta.text();

      let dados;

      try {
        dados = JSON.parse(texto);
      } catch (erroJson) {

        throw new Error(
          "O servidor retornou conteúdo que não é JSON. " +
          "Verifique se o Railway terminou o deploy."
        );
      }

      if (!resposta.ok || !dados.success) {

        throw new Error(
          dados.error ||
          "O servidor retornou um erro."
        );
      }

      resultado.innerText =
        "🤖 Agente Superpowers:\n\n" +
        dados.response;

    } catch (erro) {

      resultado.className =
        "resultado erro";

      resultado.innerText =
        "❌ Erro na comunicação com o agente.\n\n" +
        "Detalhes: " +
        erro.message;

    } finally {

      botao.disabled = false;
      botao.innerText = "🚀 Enviar comando";
    }
  }

  verificarServidor();

</script>

</body>
</html>
