<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Superpowers IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #111936, #18265a);
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #2d3b73;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #aeb9df;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 15px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #121a32;
      border: 1px solid #26345f;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    .card {
      background: #11182d;
      border: 1px solid #26345f;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #dbe4ff;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid #344577;
      border-radius: 12px;
      background: #080d1b;
      color: #ffffff;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6b8cff;
      box-shadow: 0 0 0 2px rgba(107,140,255,.15);
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f6fff, #7c4dff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .92;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .response {
      margin-top: 20px;
      background: #080d1b;
      border: 1px solid #26345f;
      border-radius: 12px;
      padding: 15px;
      min-height: 100px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #dbe4ff;
    }

    .thinking {
      color: #9eafff;
    }

    .error {
      color: #ff8d8d;
    }

    .success {
      color: #8ff0ae;
    }

    .footer {
      text-align: center;
      color: #68759d;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Agente Superpowers IA</h1>
  <p>Seu assistente inteligente conectado ao Gemini</p>
</header>

<div class="container">

  <div class="status">
    <span class="dot"></span>
    <span id="statusText">Agente online — pronto para receber comandos</span>
  </div>

  <div class="card">

    <label for="command">
      🤖 O que você quer que o Agente Superpowers faça?
    </label>

    <textarea
      id="command"
      placeholder="Exemplo: Crie uma ideia completa para um aplicativo de vendas..."
    ></textarea>

    <button id="sendButton" onclick="sendCommand()">
      🚀 Enviar comando
    </button>

    <div id="response" class="response">
      A resposta do Gemini aparecerá aqui.
    </div>

  </div>

  <div class="footer">
    Agente Superpowers • Backend protegido no Railway
  </div>

</div>

<script>
  // URL DO SEU BACKEND RAILWAY
  const API_URL = "https://agente-superpowers-production.up.railway.app";

  const commandInput = document.getElementById("command");
  const responseBox = document.getElementById("response");
  const sendButton = document.getElementById("sendButton");
  const statusText = document.getElementById("statusText");

  async function sendCommand() {

    const command = commandInput.value.trim();

    if (!command) {
      responseBox.className = "response error";
      responseBox.textContent = "⚠️ Digite um comando primeiro.";
      return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "⏳ Processando...";

    responseBox.className = "response thinking";
    responseBox.textContent = "🤖 O Agente Superpowers está pensando...";

    statusText.textContent = "Processando seu comando...";

    try {

      const response = await fetch(API_URL + "/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: command
        })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "O servidor respondeu, mas não enviou uma resposta válida."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "O servidor encontrou um erro."
        );
      }

      const answer =
        data.response ||
        data.text ||
        data.message ||
        data.result;

      if (!answer) {
        throw new Error(
          "O Gemini respondeu, mas o servidor não retornou o texto esperado."
        );
      }

      responseBox.className = "response success";
      responseBox.textContent = answer;

      statusText.textContent = "Agente online — comando concluído";

    } catch (error) {

      console.error(error);

      responseBox.className = "response error";

      responseBox.textContent =
        "❌ Não foi possível processar o comando.\n\n" +
        "Detalhes: " + error.message;

      statusText.textContent = "Erro na comunicação com o agente";

    } finally {

      sendButton.disabled = false;
      sendButton.textContent = "🚀 Enviar comando";
    }
  }

  // Permite enviar com Ctrl + Enter
  commandInput.addEventListener("keydown", function(event) {

    if (event.ctrlKey && event.key === "Enter") {
      sendCommand();
    }

  });
</script>

</body>
</html>
