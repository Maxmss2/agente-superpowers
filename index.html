<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Superpowers IA</title>

  <!-- Renderizador de Markdown e Highlights de Código -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: linear-gradient(135deg, #111936, #18265a);
      border-bottom: 1px solid #29376e;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #b9c4ee;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: #111936;
      border: 1px solid #29376e;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .status {
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #0b1020;
      color: #9ee7b0;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #dce2ff;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #354477;
      background: #080d1b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6d8cff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #526dff, #7657ff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* Histórico de Conversa */
    .chat-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg {
      padding: 18px;
      border-radius: 12px;
      background: #080d1b;
      border: 1px solid #29376e;
      line-height: 1.6;
    }

    .msg.user {
      border-color: #526dff;
      background: #131d3d;
    }

    .msg.erro {
      border-color: #ff5555;
      color: #ff9d9d;
    }

    .msg pre {
      background: #000;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #7f8bb8;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Agente Superpowers IA</h1>
  <p>Seu assistente inteligente conectado ao Gemini</p>
</header>

<main>
  <div class="card">

    <div class="status" id="status">
      🟡 Verificando conexão com o agente...
    </div>

    <label for="prompt">
      🤖 O que você quer que o Agente Superpowers faça?
    </label>

    <textarea
      id="prompt"
      placeholder="Digite seu comando aqui... (Ctrl + Enter para enviar)"
    >Olá, Agente Superpowers! Diga quem você é e confirme que está conectado ao Gemini.</textarea>

    <button id="btn" onclick="enviarComando()">
      🚀 Enviar comando
    </button>

    <div id="chatContainer" class="chat-container"></div>

  </div>
</main>

<footer>
  Agente Superpowers IA • Powered by Gemini
</footer>

<script>
  const BACKEND_URL = "https://agente-superpowers-production.up.railway.app";

  // Suporte a atalho Ctrl+Enter para envio rápido
  document.getElementById("prompt").addEventListener("keydown", function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      enviarComando();
    }
  });

  async function verificarServidor() {
    const status = document.getElementById("status");

    try {
      const resposta = await fetch(BACKEND_URL + "/", { method: "GET" });
      const dados = await resposta.json();

      if (dados.status === "online") {
        if (dados.gemini) {
          status.innerHTML = "🟢 Agente online • Gemini conectado";
        } else {
          status.innerHTML = "🟡 Agente online • GEMINI_API_KEY não encontrada";
        }
      } else {
        status.innerHTML = "🔴 O servidor respondeu de forma inesperada";
      }
    } catch (erro) {
      status.innerHTML = "🔴 Não foi possível conectar ao backend";
    }
  }

  async function enviarComando() {
    const promptInput = document.getElementById("prompt");
    const prompt = promptInput.value.trim();
    const chatContainer = document.getElementById("chatContainer");
    const botao = document.getElementById("btn");

    if (!prompt) {
      alert("⚠️ Digite um comando primeiro.");
      return;
    }

    // Adiciona pergunta do usuário ao histórico
    const userMsgDiv = document.createElement("div");
    userMsgDiv.className = "msg user";
    userMsgDiv.innerHTML = `<strong>👤 Você:</strong><br>${prompt}`;
    chatContainer.appendChild(userMsgDiv);

    // Div temporária de carregamento da IA
    const aiMsgDiv = document.createElement("div");
    aiMsgDiv.className = "msg";
    aiMsgDiv.innerHTML = "🤖 <em>Agente Superpowers está pensando...</em>";
    chatContainer.appendChild(aiMsgDiv);

    // Scroll para a última mensagem
    aiMsgDiv.scrollIntoView({ behavior: 'smooth' });

    // Prepara interface para carregamento
    botao.disabled = true;
    botao.innerText = "⏳ Processando...";
    promptInput.value = "";

    try {
      const resposta = await fetch(BACKEND_URL + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt })
      });

      const texto = await resposta.text();
      let dados;

      try {
        dados = JSON.parse(texto);
      } catch (erroJson) {
        throw new Error("O servidor retornou conteúdo inválido (não é JSON). Verifique se o deploy finalizou.");
      }

      if (!resposta.ok || !dados.success) {
        throw new Error(dados.error || "O servidor retornou um erro.");
      }

      // Converte Markdown em HTML formatado
      const markdownFormatado = marked.parse(dados.response);

      aiMsgDiv.innerHTML = `<strong>🤖 Agente Superpowers:</strong><br>${markdownFormatado}`;

      // Aplica destaque de sintaxe em blocos de código
      aiMsgDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

    } catch (erro) {
      aiMsgDiv.className = "msg erro";
      aiMsgDiv.innerHTML = `❌ <strong>Erro na comunicação:</strong><br>${erro.message}`;
    } finally {
      botao.disabled = false;
      botao.innerText = "🚀 Enviar comando";
      aiMsgDiv.scrollIntoView({ behavior: 'smooth' });
    }
  }

  verificarServidor();
</script>

</body>
</html>
