<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Superpowers IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #111936, #18265a);
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #29345f;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #aeb9df;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: #121a32;
      border: 1px solid #29345f;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b9c4e8;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      background: #080d1b;
      color: white;
      border: 1px solid #34416f;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #667eea;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #0b1226;
      color: #aeb9df;
      display: none;
    }

    #resposta {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #e8ecff;
      min-height: 50px;
    }

    .online {
      color: #63e6be;
      font-weight: bold;
    }

    .aviso {
      font-size: 13px;
      color: #8f9bc4;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Agente Superpowers IA</h1>
  <p>Seu agente inteligente para executar tarefas com IA</p>
</header>

<div class="container">

  <div class="card">

    <label for="backendUrl">
      🌐 URL do servidor
    </label>

    <input
      id="backendUrl"
      type="url"
      placeholder="https://seu-servidor.up.railway.app"
    >

    <div class="aviso">
      Essa é a URL pública do servidor onde o Gemini está conectado.
      Sua chave Gemini NÃO fica neste site.
    </div>

  </div>

  <div class="card">

    <label for="comando">
      🤖 O que você quer que o Agente Superpowers faça?
    </label>

    <textarea
      id="comando"
      placeholder="Exemplo: Crie uma página web completa para uma loja de roupas..."
    ></textarea>

    <button id="btnExecutar" onclick="executarAgente()">
      ⚡ EXECUTAR COMANDO
    </button>

    <div id="status"></div>

  </div>

  <div class="card">

    <h2>🧠 Resposta da IA</h2>

    <div id="resposta">
      Aguardando seu comando...
    </div>

  </div>

</div>

<script>

  const backendInput = document.getElementById("backendUrl");
  const comandoInput = document.getElementById("comando");
  const resposta = document.getElementById("resposta");
  const status = document.getElementById("status");
  const botao = document.getElementById("btnExecutar");

  // Recupera automaticamente a URL salva anteriormente
  const urlSalva = localStorage.getItem("superpowers_backend_url");

  if (urlSalva) {
    backendInput.value = urlSalva;
  }

  async function executarAgente() {

    let backendUrl = backendInput.value.trim();
    const comando = comandoInput.value.trim();

    if (!backendUrl) {
      alert("Cole primeiro a URL pública do seu servidor.");
      backendInput.focus();
      return;
    }

    if (!comando) {
      alert("Digite o que você quer que o Agente Superpowers faça.");
      comandoInput.focus();
      return;
    }

    // Remove barra final
    backendUrl = backendUrl.replace(/\/+$/, "");

    // Salva a URL no celular
    localStorage.setItem("superpowers_backend_url", backendUrl);

    botao.disabled = true;
    botao.textContent = "⏳ PROCESSANDO...";

    status.style.display = "block";
    status.textContent = "🔄 Enviando seu comando para o Agente Superpowers...";

    resposta.textContent = "";

    try {

      let resultado;

      /*
        Primeiro tenta /generate.
        Caso o servidor utilize /api/generate,
        tenta automaticamente a segunda opção.
      */

      try {

        resultado = await fetch(backendUrl + "/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: comando,
            message: comando
          })
        });

      } catch (erro) {

        resultado = await fetch(backendUrl + "/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: comando,
            message: comando
          })
        });

      }

      const texto = await resultado.text();

      let dados;

      try {
        dados = JSON.parse(texto);
      } catch {
        dados = {
          resposta: texto
        };
      }

      if (!resultado.ok) {
        throw new Error(
          dados.error ||
          dados.message ||
          "O servidor retornou um erro."
        );
      }

      const respostaIA =
        dados.resposta ||
        dados.response ||
        dados.text ||
        dados.message ||
        dados.output ||
        texto;

      resposta.textContent = respostaIA;

      status.textContent =
        "🟢 Comando executado com sucesso!";

      status.className = "online";

    } catch (erro) {

      console.error(erro);

      status.textContent =
        "🔴 Não foi possível conectar ao servidor.";

      resposta.textContent =
        "Erro: " + erro.message +
        "\n\nVerifique se a URL do servidor está correta e se o deploy está Online.";

    } finally {

      botao.disabled = false;
      botao.textContent = "⚡ EXECUTAR COMANDO";

    }

  }

</script>

</body>
</html>
