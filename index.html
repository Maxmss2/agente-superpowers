<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Superpowers IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      background: linear-gradient(135deg, #111936, #18265a);
      border-bottom: 1px solid #29376e;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #b9c4ee;
    }

    main {
      width: 100%;
      max-width: 800px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .status {
      background: #111936;
      border: 1px solid #29376e;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: center;
      color: #9fffae;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #35457f;
      background: #080d1c;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #667cff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #5865f2, #7c4dff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .resultado {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #111936;
      border: 1px solid #29376e;
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 80px;
    }

    .erro {
      color: #ff8f8f;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 Agente Superpowers IA</h1>
    <p>Seu assistente inteligente conectado ao Gemini</p>
  </header>

  <main>

    <div class="status" id="status">
      🔄 Verificando conexão com o agente...
    </div>

    <textarea
      id="comando"
      placeholder="🤖 O que você quer que o Agente Superpowers faça?"
    ></textarea>

    <button id="enviar">
      🚀 Enviar comando
    </button>

    <div class="resultado" id="resultado">
      O resultado do agente aparecerá aqui.
    </div>

  </main>

  <script>
    // ENDEREÇO DO SEU BACKEND NO RAILWAY
    const API_URL = "https://agente-superpowers-production.up.railway.app";

    const comando = document.getElementById("comando");
    const enviar = document.getElementById("enviar");
    const resultado = document.getElementById("resultado");
    const status = document.getElementById("status");

    // Testa se o backend está online
    async function verificarServidor() {
      try {
        const resposta = await fetch(API_URL);

        if (!resposta.ok) {
          throw new Error("Servidor respondeu com erro " + resposta.status);
        }

        const dados = await resposta.json();

        if (dados.status === "online") {
          status.innerHTML = "🟢 Agente online e conectado ao Gemini";
        } else {
          status.innerHTML = "🟡 Servidor online, mas resposta inesperada";
        }

      } catch (erro) {
        console.error(erro);
        status.innerHTML = "🔴 Não foi possível conectar ao agente";
      }
    }

    async function enviarComando() {

      const texto = comando.value.trim();

      if (!texto) {
        resultado.innerHTML = "⚠️ Digite um comando primeiro.";
        return;
      }

      enviar.disabled = true;
      enviar.innerText = "⏳ Processando...";
      resultado.className = "resultado";
      resultado.innerText = "🤖 O Agente Superpowers está pensando...";

      try {

        const resposta = await fetch(API_URL + "/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: texto
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.error ||
            dados.message ||
            "Erro HTTP " + resposta.status
          );
        }

        // Aceita diferentes formatos de resposta do backend
        const textoResposta =
          dados.resposta ||
          dados.response ||
          dados.text ||
          dados.message ||
          dados.output;

        if (!textoResposta) {
          throw new Error("O servidor respondeu, mas não enviou uma resposta válida.");
        }

        resultado.innerText = textoResposta;

      } catch (erro) {

        console.error("Erro:", erro);

        resultado.className = "resultado erro";

        resultado.innerText =
          "❌ Erro na comunicação com o agente.\n\n" +
          "Detalhes: " + erro.message;
      }

      enviar.disabled = false;
      enviar.innerText = "🚀 Enviar comando";
    }

    enviar.addEventListener("click", enviarComando);

    comando.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && event.ctrlKey) {
        enviarComando();
      }
    });

    verificarServidor();
  </script>

</body>
</html>
